<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>错题本</title>
<style>
:root{--bg:#f6f4ee;--card:#fffdf8;--ink:#1d2b3a;--sub:#6b7480;--line:#d9d4c7;--red:#c0392b;--blue:#1f5f8b;--sel:#1f5f8b;--selt:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#161a1f;--card:#1f252c;--ink:#e8e6e0;--sub:#9aa3ad;--line:#333b44;--red:#e0675a;--blue:#6fb0dc;--sel:#6fb0dc;--selt:#10161c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang SC",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:6px 0 12px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 8px;color:var(--sub);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.lab{width:52px;color:var(--sub);font-size:14px}
button,select,input,textarea{font:inherit;color:inherit}
.chip{min-width:44px;height:40px;padding:0 10px;border:1px solid var(--line);background:transparent;border-radius:8px;cursor:pointer}
.chip.on{background:var(--sel);color:var(--selt);border-color:var(--sel)}
.chip.bad.on{background:var(--red);border-color:var(--red);color:#fff}
.btn{height:40px;padding:0 14px;border:1px solid var(--blue);color:var(--blue);background:transparent;border-radius:8px;cursor:pointer}
.btn.fill{background:var(--blue);color:var(--selt)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:transparent;padding:8px}
select{height:40px;border:1px solid var(--line);border-radius:8px;background:transparent;padding:0 8px}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-child{border-top:0}
.t{font-weight:600}
.ans b{color:var(--red)}
.ans i{font-style:normal;color:var(--blue);font-weight:600}
.note{width:100%;border:0;border-bottom:1px dashed var(--line);background:transparent;padding:4px 0;margin-top:4px;font-size:14px}
.sm{font-size:13px;color:var(--sub)}
.warn{color:var(--red)}
.del{border:0;background:none;color:var(--sub);cursor:pointer;float:right;padding:4px 8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<main>
<h1>错题本</h1>
<p id="backup" class="sm"></p>

<section>
  <h2>快速录入（点选后自动保存）</h2>
  <div class="row"><span class="lab">年份</span><select id="year"></select>
    <span class="lab" style="width:auto;margin-left:8px">Text</span><span id="texts"></span></div>
  <div class="row"><span class="lab">题号</span><span id="qs"></span></div>
  <div class="row"><span class="lab">我选</span><span id="mine"></span></div>
  <div class="row"><span class="lab">正确</span><span id="right"></span></div>
  <div class="row"><span class="lab">原因</span><span id="why"></span></div>
  <div class="row"><button class="btn" id="undo">撤销上一条</button><span class="sm" id="hint">先点“我选”，再点“正确”，选完自动保存并跳到下一题</span></div>
</section>

<section>
  <h2>批量录入（每行：年份 Text 题号 我选 正确）</h2>
  <textarea id="bulk" placeholder="例：&#10;2019 2 3 B C&#10;2019 2 4 A D 逻辑反了"></textarea>
  <div class="row" style="margin-top:8px"><button class="btn fill" id="bulkGo">批量添加</button></div>
</section>

<section>
  <h2>备份</h2>
  <div class="row">
    <button class="btn fill" id="exp">导出文件</button>
    <button class="btn" id="copy">复制到剪贴板</button>
    <button class="btn" id="impBtn">导入文件</button>
    <input type="file" id="imp" accept=".json,application/json" hidden>
  </div>
  <textarea id="paste" placeholder="也可以把备份内容粘贴到这里，再点下面按钮" style="min-height:50px"></textarea>
  <div class="row" style="margin-top:8px"><button class="btn" id="impPaste">从粘贴内容导入</button></div>
  <p class="sm">导入时会与现有错题合并，不会覆盖。</p>
</section>

<section>
  <h2>全部错题 <span id="cnt" class="sm"></span></h2>
  <div class="row"><select id="filter"></select></div>
  <div id="list"></div>
</section>
</main>
<div id="toast"></div>
<script>
var KEY='kaoyan-wrong-v1',META='kaoyan_wrong_meta';
var L=['A','B','C','D'],REASONS=['词义','定位','逻辑','态度','没读懂','粗心'];
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('保存失败，请立刻导出备份')}}
function meta(){try{return JSON.parse(localStorage.getItem(META))||{}}catch(e){return {}}}
var data=load(),st={year:2023,text:1,q:1,mine:null,right:null,why:null};
var $=function(id){return document.getElementById(id)};
function toast(m){var t=$('toast');t.textContent=m;t.className='show';clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=''},1600)}
function chips(id,arr,key,cls,fn){
  var el=$(id);el.innerHTML='';
  arr.forEach(function(v){
    var b=document.createElement('button');b.className='chip '+(cls||'')+(st[key]===v?' on':'');b.textContent=v;
    b.onclick=function(){fn(v)};el.appendChild(b)});
}
function draw(){
  chips('texts',[1,2,3,4],'text','',function(v){st.text=v;draw()});
  chips('qs',[1,2,3,4,5],'q','',function(v){st.q=v;draw()});
  chips('mine',L,'mine','bad',function(v){st.mine=v;st.right=null;draw()});
  chips('right',L,'right','',function(v){st.right=v;commit()});
  chips('why',REASONS,'why','',function(v){st.why=st.why===v?null:v;draw()});
}
function commit(){
  if(!st.mine||!st.right){draw();return}
  if(st.mine===st.right){toast('我选和正确一样，没有记录');st.right=null;draw();return}
  data.unshift({id:Date.now()+Math.random(),year:st.year,text:st.text,q:st.q,mine:st.mine,right:st.right,why:st.why||'',note:'',done:false});
  save();toast('已记录：'+st.year+' Text'+st.text+' 第'+st.q+'题');
  st.q=st.q<5?st.q+1:1;st.mine=null;st.right=null;st.why=null;draw();render();
}
$('undo').onclick=function(){if(data.length){var d=data.shift();save();render();toast('已撤销：'+d.year+' Text'+d.text+' 第'+d.q+'题')}};
(function(){
  var y=$('year'),f=$('filter');
  for(var i=2023;i>=2007;i--){y.add(new Option(i,i))}
  f.add(new Option('全部年份','all'));for(var j=2023;j>=2007;j--){f.add(new Option(j,j))}
  y.onchange=function(){st.year=+y.value};
  f.onchange=render;
})();
function render(){
  var f=$('filter').value,list=data.filter(function(d){return f==='all'||d.year==f});
  $('cnt').textContent='（'+list.length+' / '+data.length+'）';
  var box=$('list');box.innerHTML='';
  if(!list.length){box.innerHTML='<p class="sm">还没有错题。在上面点选就能录入。</p>'}
  list.forEach(function(d){
    var el=document.createElement('div');el.className='item';
    el.innerHTML='<button class="del" aria-label="删除">删除</button><div class="t">'+d.year+' Text '+d.text+(d.q?' 第'+d.q+'题':'')+(d.why?' <span class="sm">· '+esc(d.why)+'</span>':'')+'</div>'+((d.mine||d.right)?'<div class="ans">我选 <b>'+esc(d.mine||'-')+'</b>　正确 <i>'+esc(d.right||'-')+'</i></div>':'');
    var lb=document.createElement('label');lb.className='sm';lb.innerHTML='<input type="checkbox"> 已掌握';
    var cb=lb.firstChild;cb.checked=!!d.done;cb.onchange=function(){d.done=cb.checked;save()};el.appendChild(lb);
    var n=document.createElement('input');n.className='note';n.placeholder='点这里写笔记';n.value=d.note||'';
    n.onchange=function(){d.note=n.value;save()};el.appendChild(n);
    el.querySelector('.del').onclick=function(){if(confirm('删除这条错题？')){data=data.filter(function(x){return x!==d});save();render()}};
    box.appendChild(el)});
  backupInfo();
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function backupInfo(){
  var m=meta(),p=$('backup');
  if(!data.length){p.textContent='';return}
  if(!m.last){p.innerHTML='<span class="warn">还没有导出过备份，建议现在导出一次。</span>'}
  else{var days=Math.floor((Date.now()-m.last)/864e5);p.innerHTML=days>=3?'<span class="warn">距离上次备份已 '+days+' 天，建议再导出一次。</span>':'上次备份：'+(days===0?'今天':days+' 天前')}
}
function stamp(){try{localStorage.setItem(META,JSON.stringify({last:Date.now()}))}catch(e){}backupInfo()}
function payload(){return JSON.stringify({app:'kaoyan-wrong',v:2,exported:new Date().toISOString(),items:data},null,1)}
$('exp').onclick=function(){
  var b=new Blob([payload()],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='错题本备份-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();stamp();toast('已导出');
};
$('copy').onclick=function(){
  var t=payload();
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){stamp();toast('已复制')},function(){$('paste').value=t;$('paste').select();toast('请手动全选复制')});
};
function merge(items){
  var seen={};data.forEach(function(d){seen[d.year+'-'+d.text+'-'+d.q+'-'+d.mine+'-'+d.right]=1});
  var add=0;items.forEach(function(d){
    if(!d||!d.year)return;
    var k=d.year+'-'+d.text+'-'+d.q+'-'+d.mine+'-'+d.right;
    if(!seen[k]){seen[k]=1;d.id=d.id||Date.now()+Math.random();data.push(d);add++}});
  data.sort(function(a,b){return b.year-a.year||b.text-a.text||b.q-a.q});
  save();render();toast('导入 '+add+' 条');
}
function importText(t){try{var o=JSON.parse(t);merge(Array.isArray(o)?o:o.items||[])}catch(e){toast('内容无法识别')}}
$('impBtn').onclick=function(){$('imp').click()};
$('imp').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){importText(r.result)};r.readAsText(f);this.value=''};
$('impPaste').onclick=function(){importText($('paste').value)};
$('bulkGo').onclick=function(){
  var add=[],bad=0;
  $('bulk').value.split(/\n/).forEach(function(line){
    line=line.trim();if(!line)return;
    var m=line.match(/^(20\d\d)\s+(?:text)?\s*([1-4])\s+([1-5])\s+([A-Da-d])\s+([A-Da-d])\s*(.*)$/i);
    if(!m||m[4].toUpperCase()===m[5].toUpperCase()){bad++;return}
    add.push({year:+m[1],text:+m[2],q:+m[3],mine:m[4].toUpperCase(),right:m[5].toUpperCase(),why:'',note:m[6]||''})});
  if(add.length)merge(add);
  $('bulk').value=bad?'（有 '+bad+' 行格式不对，已跳过）':'';
  if(bad)toast(bad+' 行格式不对');
};
draw();render();
</script>
</body>
</html>
