<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>考研英语阅读错题本</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#202637;--muted:#687287;--line:#e6eaf1;--accent:#3659d9;--accent-soft:#edf1ff;--good:#198754;--bad:#c23b2e;--shadow:0 10px 30px rgba(28,42,75,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.55}
.wrap{max-width:920px;margin:0 auto;padding:28px 16px 52px}
.hero{padding:22px 24px;border-radius:24px;background:linear-gradient(135deg,#202f68,#4268e8);color:#fff;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(24px,5vw,32px);line-height:1.2;margin:0 0 6px}.hero p{margin:0;color:#e5eaff;font-size:14px}
.hero a{display:inline-block;color:#fff;font-size:14px;margin-bottom:12px;text-decoration:none;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.stat,.panel,.item{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.stat{padding:16px}.stat .label{font-size:13px;color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:4px}
.panel{padding:20px;margin-top:16px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.section-head h2{font-size:18px;margin:0}.muted{color:var(--muted);font-size:13px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:7.5em 1fr 2em;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.bar i{display:block;height:10px;border-radius:999px;background:linear-gradient(90deg,#e8776b,#c23b2e);min-width:4px}
.bar em{font-style:normal;text-align:right}
form{display:grid;gap:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:grid;gap:5px;font-size:13px;color:var(--muted)}
select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fafbfe;border:1px solid var(--line);border-radius:12px;padding:11px 12px}
textarea{min-height:76px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg button{padding:11px 0;font:700 16px inherit;font-family:inherit;border:1px solid var(--line);background:#fafbfe;color:var(--ink);border-radius:12px;cursor:pointer}
.seg button.on.mine{background:var(--bad);color:#fff;border-color:var(--bad)}
.seg button.on.right{background:var(--good);color:#fff;border-color:var(--good)}
.btn{border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-weight:650;background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;font-size:15px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:hover{filter:brightness(.97)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:16px}
.filters button{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.filters button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.list{display:grid;gap:12px;margin-top:12px}
.item{padding:16px;border-left:5px solid var(--bad)}
.item.done{border-left-color:var(--good);opacity:.75}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.src{font-weight:700;font-size:16px}
.tag{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.ans{margin-top:4px;font-size:15px}
.ans .x{color:var(--bad);font-weight:700;text-decoration:line-through}.ans .v{color:var(--good);font-weight:700}
.note{margin:8px 0 0;font-size:14px;color:var(--muted);white-space:pre-wrap}
.acts{display:flex;gap:18px;margin-top:10px}
.acts button{background:none;border:0;padding:4px 0;font:inherit;font-size:14px;font-weight:650;color:var(--accent);cursor:pointer}
.acts .del{color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:28px 0;font-size:14px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
@media(max-width:380px){.wrap{padding:16px 10px 36px}.stat strong{font-size:21px}.stat{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <a href="index.html">‹ 返回打卡</a>
    <h1>阅读错题本</h1>
    <p>记下错因，再按错因复盘，比重复刷题更有效。</p>
  </header>

  <section class="stats" aria-label="错题统计">
    <div class="stat"><div class="label">错题总数</div><strong id="sTotal">0</strong></div>
    <div class="stat"><div class="label">未掌握</div><strong id="sOpen">0</strong></div>
    <div class="stat"><div class="label">近 7 天新增</div><strong id="sWeek">0</strong></div>
  </section>

  <section class="panel">
    <div class="section-head"><h2>错因分布</h2><span class="muted">只统计未掌握的题</span></div>
    <div class="bars" id="bars"></div>
  </section>

  <section class="panel">
    <div class="section-head"><h2>记一道错题</h2><span class="muted" id="srcHint"></span></div>
    <form id="form">
      <div class="row">
        <label class="f">年份<select id="year"></select></label>
        <label class="f">题号<select id="qno"></select></label>
      </div>
      <div class="f">我的答案<div class="seg" id="mine"></div></div>
      <div class="f">正确答案<div class="seg" id="right"></div></div>
      <label class="f">错因<select id="reason"></select></label>
      <label class="f">备注（定位句、生词、教训）<textarea id="memo" placeholder="例如：第 3 段 however 之后才是作者态度"></textarea></label>
      <button class="btn primary" type="submit">保存错题</button>
    </form>
  </section>

  <div class="filters" id="filters"></div>
  <div class="list" id="list"></div>

  <section class="panel">
    <div class="section-head"><h2>错题备份</h2><span class="muted">数据保存在当前浏览器</span></div>
    <div class="actions">
      <button class="btn primary" id="exp">导出错题备份</button>
      <button class="btn" id="imp">导入备份</button>
      <input type="file" id="file" accept="application/json,.json" hidden>
    </div>
  </section>
</div>

<script>
(function(){
  var KEY="kaoyan-wrong-v1";
  var REASONS=["词汇不会","长难句没读懂","定位错误","过度推断","主旨/态度偏了","没时间","粗心","其他"];
  var data=[],filter={reason:"全部",status:"open"},pick={mine:"",right:""};
  function $(id){return document.getElementById(id)}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function load(){try{var a=JSON.parse(localStorage.getItem(KEY)||"[]");data=Array.isArray(a)?a:[]}catch(e){data=[]}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert("浏览器无法保存，请检查是否开启了无痕模式")}}
  function textOf(q){return Math.floor((q-21)/5)+1}

  var ys="";for(var y=2023;y>=2007;y--)ys+="<option>"+y+"</option>";$("year").innerHTML=ys;
  var qs="";for(var t=1;t<=4;t++){qs+='<optgroup label="Text '+t+'">';for(var q=21+(t-1)*5;q<=20+t*5;q++)qs+="<option>"+q+"</option>";qs+="</optgroup>"}
  $("qno").innerHTML=qs;
  $("reason").innerHTML=REASONS.map(function(r){return"<option>"+r+"</option>"}).join("");
  function hint(){$("srcHint").textContent="Text "+textOf(+$("qno").value)}
  $("qno").onchange=hint;hint();

  ["mine","right"].forEach(function(k){
    var box=$(k);
    "ABCD".split("").forEach(function(c){
      var b=document.createElement("button");b.type="button";b.textContent=c;
      b.onclick=function(){pick[k]=c;[].forEach.call(box.children,function(x){x.className=""});b.className="on "+k};
      box.appendChild(b);
    });
  });

  $("form").onsubmit=function(e){
    e.preventDefault();
    if(!pick.mine||!pick.right){alert("请选择“我的答案”和“正确答案”");return}
    if(pick.mine===pick.right){alert("两个答案相同，不算错题");return}
    var q=+$("qno").value;
    data.unshift({id:Date.now(),year:$("year").value,text:String(textOf(q)),q:String(q),
      mine:pick.mine,right:pick.right,reason:$("reason").value,memo:$("memo").value.trim(),done:false,at:Date.now()});
    save();$("memo").value="";
    pick={mine:"",right:""};
    ["mine","right"].forEach(function(k){[].forEach.call($(k).children,function(x){x.className=""})});
    if(q<40){$("qno").value=q+1;hint()}
    render();
  };

  function render(){
    var week=Date.now()-7*864e5,open=data.filter(function(d){return!d.done});
    $("sTotal").textContent=data.length;
    $("sOpen").textContent=open.length;
    $("sWeek").textContent=data.filter(function(d){return d.at>week}).length;

    var cnt={};REASONS.forEach(function(r){cnt[r]=0});
    open.forEach(function(d){cnt[d.reason]=(cnt[d.reason]||0)+1});
    var max=Math.max.apply(null,Object.keys(cnt).map(function(k){return cnt[k]}).concat([1]));
    var shown=REASONS.filter(function(r){return cnt[r]});
    $("bars").innerHTML=shown.length?shown.map(function(r){
      return'<div class="bar"><span>'+r+'</span><i style="width:'+(cnt[r]/max*100)+'%"></i><em>'+cnt[r]+'</em></div>'}).join(""):
      '<div class="empty" style="padding:6px 0">暂无数据。记下第一道错题后，这里会显示你最常错在哪。</div>';

    var html=[["open","未掌握"],["done","已掌握"],["all","全部"]].map(function(f){
      return'<button data-k="status" data-v="'+f[0]+'" class="'+(filter.status===f[0]?"on":"")+'">'+f[1]+'</button>'}).join("");
    html+=["全部"].concat(REASONS).map(function(r){
      return'<button data-k="reason" data-v="'+r+'" class="'+(filter.reason===r?"on":"")+'">'+r+'</button>'}).join("");
    $("filters").innerHTML=html;
    [].forEach.call($("filters").children,function(b){b.onclick=function(){filter[b.dataset.k]=b.dataset.v;render()}});

    var rows=data.filter(function(d){
      if(filter.status==="open"&&d.done)return false;
      if(filter.status==="done"&&!d.done)return false;
      return filter.reason==="全部"||d.reason===filter.reason;
    });
    $("list").innerHTML=rows.length?rows.map(function(d){
      return'<article class="item'+(d.done?" done":"")+'">'+
        '<div class="top"><span class="src">'+esc(d.year)+' 年 Text '+esc(d.text)+' · 第 '+esc(d.q)+' 题</span><span class="tag">'+esc(d.reason)+'</span></div>'+
        '<div class="ans">我选 <span class="x">'+esc(d.mine)+'</span>　正确 <span class="v">'+esc(d.right)+'</span></div>'+
        (d.memo?'<p class="note">'+esc(d.memo)+'</p>':"")+
        '<div class="acts"><button data-a="done" data-id="'+d.id+'">'+(d.done?"标为未掌握":"标为已掌握")+'</button>'+
        '<button class="del" data-a="del" data-id="'+d.id+'">删除</button></div></article>'}).join(""):
      '<div class="empty">这里没有错题。</div>';
    [].forEach.call($("list").querySelectorAll("button[data-a]"),function(b){
      b.onclick=function(){
        var id=+b.dataset.id,i=data.findIndex(function(x){return x.id===id});
        if(i<0)return;
        if(b.dataset.a==="del"){if(confirm("确定删除这道错题？"))data.splice(i,1)}
        else data[i].done=!data[i].done;
        save();render();
      };
    });
  }

  $("exp").onclick=function(){
    var blob=new Blob([JSON.stringify({app:"考研英语阅读错题本",version:1,wrong:data},null,2)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="考研英语阅读错题备份.json";a.click();URL.revokeObjectURL(a.href);
  };
  $("imp").onclick=function(){$("file").click()};
  $("file").onchange=function(){
    var f=this.files[0],input=this;if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var obj=JSON.parse(r.result),arr=Array.isArray(obj)?obj:obj.wrong;
        if(!Array.isArray(arr))throw 0;
        var ids={};data.forEach(function(d){ids[d.id]=1});
        arr.forEach(function(d){if(d&&d.id&&d.year&&d.mine&&d.right&&!ids[d.id])data.push(d)});
        data.sort(function(a,b){return b.at-a.at});save();render();alert("导入成功！");
      }catch(e){alert("无法读取这个备份文件，请选择本页导出的 JSON 文件。")}
      input.value="";
    };
    r.readAsText(f);
  };

  load();render();
})();
</script>
</body>
</html>
